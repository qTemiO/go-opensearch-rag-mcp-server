[project]
name = "go-opensearch-rag-mcp-server"
version = "0.2.0"
description = "MCP server for GoOpenDB: RAG search, documents and agent-constructor configuration"
authors = [
    {name = "qTemiO",email = "71713499+qTemiO@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp (>=4.0.11,<5.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry]
packages = [{include = "goopendb_mcp"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
